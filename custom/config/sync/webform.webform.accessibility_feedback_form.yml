id: accessibility_feedback_form
title: 'Accessibility feedback form'
description: 'This form is duplicated from Contact Form'
category: feedback
elements: |-
  descriptionoffeedbackform:
    '#type': processed_text
    '#text': |-
      <div class="row mrgn-tp-lg">
        <div class="col-md-8">
          <p>Provide feedback on Agriculture and Agri-Food Canada’s (AAFC) accessibility plan, barriers you have experienced, or any matter related to accessibility.</p>
          <p>You can consult the <a href="feedback-process.html">Accessibility feedback process</a> for other ways to provide feedback and how we use your feedback.</p>
          <details class="mrgn-tp-lg">
            <summary>Privacy disclaimer</summary>
            <div class="row mrgn-tp-lg">
              <div class="col-md-12">
                <p>The collection of personal information is authorized by section 7(1)(a) and Section 70 of the <em>Accessible Canada Act</em>.  This personal information is collected by the Accessibility Office to comply with the <em>Accessible Canada Act</em> by creating a mechanism to collect feedback and be able to respond back to the individual and acknowledge that their feedback has been collected and how it was handled.</p>
                <p>Collection and use of this personal information is in accordance with the <em>Privacy Act</em>. The mechanism is used to collect feedback internally and externally on our Accessibility Plan, future progress reports, as well as accessibility and barriers to accessibility within the work carried out in each department.</p>
                <p>The personal information collected is described in Personal Information Bank PSU 938 – 
                  Outreach Activities and will be retained for 7 years. Under the <em>Privacy Act</em> you have the right of access to, and correction of, your personal information. To exercise either of these rights, contact AAFC’s ATIP Coordinator. If you are not satisfied with AAFC’s response to your privacy concern, you may wish to Contact the Office of the Privacy Commissioner of Canada.</p>
                <h2 class="h3">Contact information</h2>
                <ul class="mrgn-tp-lg">
                  <li><a href="https://agriculture.canada.ca/en/about-our-department/transparency-and-corporate-reporting/access-information-and-protection-privacy-agriculture-and-agri-food-canada">AAFC’s Access to Information and Privacy Office</a></li>
                  <li><a href="https://www.priv.gc.ca/en/contact-the-opc/">Contact the Office of the Privacy Commissioner of Canada</a></li>
                </ul>
                <h2 class="h3">References</h2>
                <ul class="mrgn-tp-lg">
                  <li><a href="https://www.laws-lois.justice.gc.ca/eng/acts/A-0.6/page-1.html">Accessible Canada Act</a>
                    <ul>
                      <li><a href="https://www.laws-lois.justice.gc.ca/eng/acts/A-0.6/page-1.html#h-1153444">section 7(1)(a)</a></li>
                      <li><a href="https://www.laws-lois.justice.gc.ca/eng/acts/A-0.6/page-5.html#h-1154040">Section 70</a></li>
                    </ul>
                  </li>
                  <li><a href="https://laws-lois.justice.gc.ca/ENG/ACTS/P-21/index.html">Privacy Act</a></li>
                  <li><a href="https://www.canada.ca/en/treasury-board-secretariat/services/access-information-privacy/access-information/information-about-programs-information-holdings/standard-personal-information-banks.html#psu938">Personal Information Bank PSU 938 – Outreach Activities</a></li>
                </ul>
              </div>
            </div>
          </details>
        </div>
      </div>
    '#format': full_html
  1_what_do_you_want_to_provide_feedback_on_:
    '#type': webform_radios_other
    '#title': '1. What do you want to provide feedback on?'
    '#options':
      'Accessibility barrier': 'Accessibility barrier'
      'AAFC''s Accessibility Plan': 'AAFC''s Accessibility Plan'
    '#other__option_label': 'Other item'
    '#other__title': 'Describe the item you want to provide feedback on'
    '#other__placeholder': ''
    '#required': true
    '#required_error': 'This field is required.'
  2_select_all_the_areas_that_are_relevant_to_your_comments:
    '#type': webform_checkboxes_other
    '#title': '2. Select all the areas that are relevant to your comments'
    '#options':
      'Physical environment (door knob, ramp, elevator, etc.)': 'Physical environment (door knob, ramp, elevator, etc.)'
      'Employment (recruitment processes, etc.)': 'Employment (recruitment processes, etc.)'
      'Technology (websites, software applications, etc.)': 'Technology (websites, software applications, etc.)'
      'Attitude (biases, micro aggressions, related to my mental health, etc.)': 'Attitude (biases, micro aggressions, related to my mental health, etc.)'
      'Information and communication (forms, plain language, bilingualism, etc.)': 'Information and communication (forms, plain language, bilingualism, etc.)'
      'Systemic exclusion (events, policies, procedures, etc.)': 'Systemic exclusion (events, policies, procedures, etc.)'
      'Procurement (bidding for contracts, etc.)': 'Procurement (bidding for contracts, etc.)'
    '#other__option_label': 'Other area'
    '#other__title': 'Describe the area you want to provide feedback on'
    '#other__placeholder': ''
  3_describe_the_issue_and_provide_comments_:
    '#type': textarea
    '#title': '3. Describe the issue and provide comments.'
    '#description': '<p>Do not include information that could identify a person.</p>'
    '#description_display': before
    '#required': true
    '#required_error': 'This field is required.'
  4_do_you_want_us_to_contact_you_about_your_feedback_:
    '#type': radios
    '#title': '4. Do you want us to contact you about your feedback?'
    '#options':
      'No': 'No'
      'Yes': 'Yes, I’m comfortable providing my email address for contact purposes only.'
    '#required': true
    '#required_error': 'This field is required.'
  email_address_yourname_domain_com_:
    '#type': email
    '#title': 'Email address (yourname@domain.com) '
    '#description': 'Your email address will only be used to contact you. It will not be shared.'
    '#description_display': before
    '#required': true
    '#required_error': 'This field is required.'
    '#states':
      visible:
        ':input[name="4_do_you_want_us_to_contact_you_about_your_feedback_"]':
          value: 'Yes'
  actions:
    '#type': webform_actions
    '#title': 'Submit button(s)'
    '#submit__label': 'Submit feedback'
    '#delete__label': Cancel
  cancel_link:
    '#type': processed_text
    '#text': |
      <p><a data-entity-substitution="canonical" data-entity-type="node" data-entity-uuid="80e5865f-ed37-4491-80de-3f16f5c04b14" href="/node/1">Cancel</a></p>
    '#format': rich_text
