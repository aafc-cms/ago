javascript: |
  var erroredMessages = [];
  $=jQuery;
  if (jQuery('section.alert-danger').length) { 
    $('section.alert-danger').removeAttr('role');
    $('section.alert-danger').attr('tabindex', '-1');
    $('section.alert-danger li a').first().trigger('focus');
  }
  setTimeout(function() {
    var erroredElements = [];
    $('section.alert-danger').removeAttr('role');
    $('section.alert-danger').attr('tabindex', '-1');
    $('section.alert-danger li a').first().trigger('focus');
    var allErrors = jQuery('section.alert-danger ul a').each(function(index) {
      erroredElements.push($(this).attr('href'));
      erroredMessages.push(cleanErrorMessage($(this).text()));
    });
    erroredElements.forEach(addErrorToFieldset);
  }, 500);
  function addErrorToFieldset(item, index, arr) {
    if (jQuery('fieldset' + item).length || $('fieldset' + item + '--wrapper').length) {
      var errorHtml = '<div class="clearfix"></div><div class="form-item--error-message alert alert-danger alert-sm">' + erroredMessages[index] + '</div>';
      $('fieldset' + item + '--wrapper').find(item).prepend(errorHtml);
      $('fieldset' + item).find(item+'radios').prepend(errorHtml);
    }
  }
  function cleanErrorMessage(text) {
    const regex = /:  ([0-99])([^]*) - ([^]*)/gm;

    // Alternative syntax using RegExp constructor
    // const regex = new RegExp(':  ([0-99])([^\\-])*- ([^]*)', 'gm')
    const str = text;
    const subst = `: $3`;
    // The substituted value will be contained in the result variable
    const result = str.replace(regex, subst);
    console.log('Substitution result: ', result);
    return result; 
  }
