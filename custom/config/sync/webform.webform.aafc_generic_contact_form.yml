id: aafc_generic_contact_form
title: 'Contact Form'
description: ''
category: ''
elements: |-
  descriptionoffeedbackform:
    '#type': processed_text
    '#text': |
      <p>Use this form to send us your questions or comments.
      </p>
      <section>
        <details class="mrgn-bttm-md open">
          <summary>
            <h2 class="h5">Privacy statement
            </h2>
          </summary>
          <p>Information collected on this form will be used to respond to your enquiry and is collected under the authority of the <a href="http://laws-lois.justice.gc.ca/eng/acts/A-9/index.html">Department of Agriculture and Agri-Food Act</a>. The personal information will be protected in accordance with the <a href="http://lois-laws.justice.gc.ca/eng/acts/P-21/index.html">Privacy Act</a> and described in Personal Information Bank <a href="https://www.canada.ca/en/treasury-board-secretariat/services/access-information-privacy/access-information/information-about-programs-information-holdings/standard-personal-information-banks.html#psu914">AAFC PSU 914 (Public Communications)</a>. Individuals have the right to access their personal information held by Agriculture and Agri-Food Canada and to request changes to incorrect personal information by contacting our Access to Information and Privacy Coordinator at <a href="mailto:aafc.atip-aiprp.aac@canada.ca">aafc.atip-aiprp.aac@canada.ca</a>.
          </p>
        </details>
      </section>
    '#format': full_html
  denotesmandatoryfield:
    '#type': processed_text
    '#text': |
      <p class="text-danger">* denotes mandatory field.
      </p>
    '#format': full_html
  yourmessage:
    '#type': textarea
    '#title': 'Your message'
    '#required': true
    '#required_error': 'This field is required.'
  emailaddress:
    '#type': email
    '#title': 'Email address (yourname@domain.com)'
    '#autocomplete': email
    '#required': true
    '#required_error': 'This field is required.'
  preferredresponselanguage:
    '#type': select
    '#title': 'Preferred response language:'
    '#options':
      English: English
      French: French
    '#required': true
    '#required_error': 'This field is required.'
  fullname:
    '#type': textfield
    '#title': 'Full name'
    '#autocomplete': name
    '#required': true
    '#required_error': 'This field is required.'
  cityortown:
    '#type': textfield
    '#title': City/Town
    '#autocomplete': address-level2
  provinceorterritory:
    '#type': textfield
    '#title': Province/Territory
    '#autocomplete': address-level1
  country:
    '#type': textfield
    '#title': Country
    '#autocomplete': country-name
  actions:
    '#type': webform_actions
    '#title': 'Submit button(s)'
    '#submit__label': 'Send message'
css: "form.webform-submission-form fieldset strong.error {\r\n  margin-bottom: 5px;\r\n  margin-top: 1px;\r\n}\r\nform.webform-submission-form fieldset .fieldset-wrapper {\r\n  position: relative;\r\n  margin-left: 15px;\r\n  margin-top: 30px;\r\n}\r\ndiv.form-item label.control-label.js-form-required.form-required,\r\nfieldset span.fieldset-legend.js-form-required.form-required {\r\n  position: relative;\r\n  margin-bottom: 0px;\r\n}\r\nsection.alert-danger ul.item-list__comma-list li {\r\n  display: block;\r\n}\r\nform.webform-submission-form div.form-item div.form-item--error-message.alert.alert-danger::before,\r\ndiv.form-item--error-message.alert.alert-danger::before,\r\ndiv.region-content form div.form-item label[for=\"*-required-\"]::after,\r\ndiv.form-item label.control-label.js-form-required.form-required::after,\r\nfieldset span.fieldset-legend.js-form-required.form-required::after {\r\n  content: none;\r\n}\r\ndiv#edit-actions,\r\ndiv#edit-cancel-link  {\r\n  display: inline-block;\r\n  padding-right: 30px;\r\n}\r\ndiv[class^=\"form-type-\"].form-type-textarea label.form-required::before,\r\nfieldset[class^=\"webform-type-\"] span.form-required::before,\r\nfieldset[class^=\".webform-radio\"] span.form-required::before,\r\nfieldset[class^=\".webform-check\"] span.form-required::before,\r\ndiv.form-item label.control-label.js-form-required.form-required::before,\r\nfieldset span.fieldset-legend.js-form-required.form-required::before {\r\n  content: \"\";\r\n  background-image: url(https://agriculture.canada.ca/themes/custom/wxt_bootstrap/images/required.svg);\r\n  display: inline-block;\r\n  line-height: 1;\r\n  color: #e00;\r\n  background-size: 7px 7px;\r\n  width: 7px;\r\n  vertical-align: super;\r\n  margin-left: 4px;\r\n  height: 7px;\r\n  position: absolute;\r\n  top: 7px;\r\n  left: -15px;\r\n}\r\n.webform-element-description {\r\n  font-size: 16px;\r\n  color: #333;\r\n}\r\ndiv.region-content form label[for=\"*-required-\"] {\r\n  position: relative