id: aafc_generic_contact_form
title: 'Contact Form'
description: ''
category: ''
elements: |-
  '#prefix': '<div class="custom-wrapper wb-frmvld">'
  '#suffix': '</div>'
  descriptionoffeedbackform:
    '#type': processed_text
    '#text': |
      <p>Use this form to send us your questions or comments.
      </p>
      <section>
        <details class="mrgn-bttm-md open">
          <summary>
            <h2 class="h5">Privacy statement
            </h2>
          </summary>
          <p>Information collected on this form will be used to respond to your enquiry and is collected under the authority of the <a href="http://laws-lois.justice.gc.ca/eng/acts/A-9/index.html">Department of Agriculture and Agri-Food Act</a>. The personal information will be protected in accordance with the <a href="http://lois-laws.justice.gc.ca/eng/acts/P-21/index.html">Privacy Act</a> and described in Personal Information Bank <a href="https://www.canada.ca/en/treasury-board-secretariat/services/access-information-privacy/access-information/information-about-programs-information-holdings/standard-personal-information-banks.html#psu914">AAFC PSU 914 (Public Communications)</a>. Individuals have the right to access their personal information held by Agriculture and Agri-Food Canada and to request changes to incorrect personal information by contacting our Access to Information and Privacy Coordinator at <a href="mailto:aafc.atip-aiprp.aac@canada.ca">aafc.atip-aiprp.aac@canada.ca</a>.
          </p>
        </details>
      </section>
    '#format': full_html
  denotesmandatoryfield:
    '#type': processed_text
    '#text': |
      <p class="text-danger">* denotes mandatory field.
      </p>
    '#format': full_html
  yourmessage:
    '#type': textarea
    '#title': 'Your message'
    '#required': true
  emailaddress:
    '#type': email
    '#title': 'Email address (yourname@domain.com)'
    '#autocomplete': email
    '#required': true
  preferredresponselanguage:
    '#type': select
    '#title': 'Preferred response language:'
    '#options':
      English: English
      French: French
    '#required': true
  fullname:
    '#type': textfield
    '#title': 'Full name'
    '#autocomplete': name
    '#required': true
  cityortown:
    '#type': textfield
    '#title': City/Town
    '#autocomplete': address-level2
  provinceorterritory:
    '#type': textfield
    '#title': Province/Territory
    '#autocomplete': address-level1
  country:
    '#type': textfield
    '#title': Country
    '#autocomplete': country-name
  actions:
    '#type': webform_actions
    '#title': 'Submit button(s)'
    '#submit__label': 'Send message'
css: "body.path-webform form.webform-submission-aafc-generic-contact-form-add-form div.form-item div.form-item--error-message.alert.alert-danger::before {\r\n  content: none;\r\n}\r\n\r\n\r\nbody.path-webform form.webform-submission-aafc-generic-contact-form-add-form label.control-label.js-form-required.form-required {\r\n  padding-bottom: 10px;\r\n}\r\n\r\n\r\nbody.path-webform form.webform-submission-aafc-generic-contact-form-add-form div.form-item div.form-item--error-message.alert.alert-danger {\r\n  border-image: none !important;\r\n  margin-bottom: 5px;\r\n  margin-left: 0px;\r\n  font-weight: bold;\r\n  background: #f3e9e8;\r\n  border-color: #d3080c;\r\n}\r\n\r\nbody.path-webform form.webform-submission-aafc-generic-contact-form-add-form div.form-item.form-item-programorservice.js-form-item-programorservice.form-group {\r\n  margin-bottom: 0px;\r\n}\r\n\r\n\r\nbody.path-webform div.region.region-highlighted ul li {\r\n  display: block;\r\n}\r\n\r\nbody.path-webform div.region.region-highlighted ul li a {\r\n  display: list-item;\r\n  list-style-position: inside;\r\n  margin-top: 15px;\r\n}\r\n\r\nbody.path-webform div.region.region-highlighted ul li::after {\r\n  content: none;\r\n}\r\n\r\nbody.path-webform div.region.region-highlighted h2.sr-only {\r\n  position: relative;\r\n  font-size: 24px;\r\n  width: 100%;\r\n  height: 100%;\r\n}\r\n\r\nbody.path-webform div.fieldset-wrapper .alert-sm {\r\n  display: flow-root;\r\n  font-size: 16px;\r\n  font-weight: bold;\r\n  margin-bottom: 5px;\r\n}\r\n\r\nbody.path-webform fieldset.required.error legend span {\r\n  color: #a94442;\r\n}\r\n\r\n\r\nform[id$=\"-add-form\"] section.alert ul li a {\r\n  font-weight: normal;\r\n}\r\n\r\nbody.path-webform div.form-item label.control-label.js-form-required.form-required::before,\r\nbody.path-webform fieldset span.fieldset-legend.js-form-required.form-required::before {\r\n  content: \"\";\r\n  background-image: url(/themes/custom/wxt_bootstrap/images/required.svg);\r\n  display: inline-block;\r\n  line-height: 1;\r\n  color: #e00;\r\n  background-size: 7px 7px;\r\n  width: 7px;\r\n  vertical-align: super;\r\n  margin-left: 4px;\r\n  height: 7px;\r\n  position: absolute;\r\n  top: 7px;\r\n  left: -15px;\r\n}\r\n\r\nbody.path-webform div.form-item label.control-label.js-form-required.form-required,\r\nbody.path-webform fieldset span.fieldset-legend.js-form-required.form-required {\r\n  position: relative;\r\n  margin-left: 10px;\r\n  margin-bottom: 0px;\r\n}\r\n\r\nbody.path-webform div.form-item label.control-label.js-form-required.form-required::after,\r\nbody.path-webform fieldset span.fieldset-legend.js-form-required.form-required::after {\r\n  content: none;\r\n}\r\n\r\nbody.path-webform form.webform-submission-aafc-generic-contact-form-add-form div.form-textarea-wrapper,\r\nbody.path-webform form.webform-submission-aafc-generic-contact-form-add-form div.select-wrapper,\r\nbody.path-webform form.webform-submission-aafc-generic-contact-form-add-form input.required.form-control {\r\n  margin-left: 10px;\r\n}\r\n\r\nbody.path-webform form.webform-submission-aafc-generic-contact-form-add-form label.control-label.js-form-required.form-required .has-error.control-label {\r\n  color: #000;\r\n}"
javascript: "var erroredMessages = [];\r\nsetTimeout(function() {\r\n  var erroredElements = [];\r\n  var allErrors = jQuery('section.alert-danger ul a').each(function(index) {\r\n    erroredElements.push($(this).attr('href'));\r\n    erroredMessages.push(cleanErrorMessage($(this).text()));\r\n  });\r\n  erroredElements.forEach(addErrorToFieldset);\r\n}, 5000);\r\nfunction addErrorToFieldset(item, index, arr) {\r\n  if (jQuery('fieldset' + item).length || $('fieldset' + item + '--wrapper').length) {\r\n    var errorHtml = '<div class=\"mrgn-tp-lg form-item--error-message alert alert-danger alert-sm\">' + erroredMessages[index] + '</div>';\r\n    $('fieldset' + item + '--wrapper').find(item).prepend(errorHtml);\r\n    $('fieldset' + item).find(item+'radios').prepend(errorHtml);\r\n  }\r\n  if (jQuery('.wb-frmvld').length) {\r\n    $('div.wb-frmvld form span.label-danger').each(function(index) {\r\n      $(this).html(cleanErrorMessage($(this).html()));\r\n    });\r\n  }\r\n}\r\nfunction cleanErrorMessage(text) {\r\n  const regex = /: (- |)([^]*)(field is required.|champ est requis.)/gm;\r\n  console.log('JO and James');\r\n  // Alternative syntax using RegExp constructor\r\n  // const regex = new RegExp(':  ([0-99])([^\\\\-])*- ([^]*)', 'gm')\r\n  const str = text;\r\n  var lang = $('html').attr('lang');\r\n  var subst = `: This $3`;\r\n  if (lang == 'fr'){\r\n    subst = `: Ce $3`;\r\n  }\r\n  // The substituted value will be contained in the result variable\r\n  const result = str.replace(regex, subst);\r\n  return result;\r\n \r\n}"
