id: yourfeedback_programsandservices
title: 'Submit your feedback -Programs and Services'
description: ''
category: feedback
elements: "descriptionoffeedbackform:\n  '#type': processed_text\n  '#text': |\n    <style type=\"text/css\">\n      p {\n        font-size: 20px;\n      }\n    </style>\n    <p>Your suggestions and ideas are important to us. Submit your feedback to help us improve the design and delivery of our programs and services. We really appreciate your taking the time to share your thoughts and suggestions with us.\n    </p>\n    <section>\n      <details class=\"mrgn-bttm-md open\">\n        <summary>\n          <h2 class=\"h5\">Privacy statement\n          </h2>\n        </summary>\n        <p>The information collected on this form, including your email address, is collected under the authority of <a href=\"http://laws-lois.justice.gc.ca/eng/acts/F-11/index.html\">Financial Administration Act</a>. The personal information will be kept confidential and will be used by those individuals require to provide additional information requested by you and assists us in improving our programs and services and will also be used anonymously in reports for service delivery improvements. Although participation is voluntary, your participation is encouraged. Your feedback is important in helping us identify your challenges, requirements, and needs to better support AAFC’s business. We take our responsibility to safeguard your personal information, as required by the <a href=\"http://lois-laws.justice.gc.ca/eng/acts/P-21/index.html\">Privacy Act</a>, very seriously, and therefore ask that you do not include sensitive personal information (such as your social insurance number, medical status, or details about your finances) in your message. The collection, use and disclosure of personal information by AAFC is administered in accordance with the federal Privacy Act and described in further detail in the <a href=\"https://www.canada.ca/en/treasury-board-secretariat/services/access-information-privacy/access-information/information-about-programs-information-holdings/standard-personal-information-banks.html#psu914\">Public Communications Bank PSU 914</a>., Individuals have the right to access their personal information and to request changes to incorrect personal information. Should you have any questions concerning your privacy, please contact AAFC’s Access to Information and Privacy office at <a href=\"mailto:aafc.atip-aiprp.aac@canada.ca\"><span class=\"nowrap\">aafc.atip-aiprp.aac@canada.ca</span></a>\n        </p>\n      </details>\n    </section>\n    \n  '#format': full_html\nprogramorservice:\n  '#type': webform_term_select\n  '#title': 'Program or service'\n  '#required': true\n  '#required_error': 'denotes mandatory field.'\n  '#vocabulary': programorservice\n  '#breadcrumb_delimiter': ''\nemailaddress:\n  '#type': email\n  '#title': 'Email address'\n  '#required': true\nfullname:\n  '#type': textfield\n  '#title': 'Full name'\n  '#required': true\ncityortown:\n  '#type': textfield\n  '#title': City/Town\n  '#required': true\nprovinceorterritory:\n  '#type': textfield\n  '#title': Province/Territory\n  '#required': true\ncountry:\n  '#type': textfield\n  '#title': Country\n  '#required': true\nyourmessage:\n  '#type': textarea\n  '#title': 'Your message'\n  '#required': true"
