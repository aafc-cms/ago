scan_blocks: null
check_links_types: 2
default_url_scheme: 'http://'
base_path: ''
extract:
  from_a: true
  from_audio: false
  from_embed: false
  from_iframe: false
  from_img: true
  from_object: false
  from_video: true
  filter_blacklist:
    linkit: linkit
    media_embed: media_embed
    blazy_filter: '0'
    editor_file_reference: '0'
    entity_embed: '0'
    filter_html_escape: '0'
    filter_html_image_secure: '0'
    filter_caption: '0'
    filter_htmlcorrector: '0'
    filter_html: '0'
    filter_align: '0'
    filter_url: '0'
    filter_autop: '0'
    token_filter: '0'
    url_embed_convert_links: '0'
    url_embed: '0'
check:
  connections_max: 2
  disable_link_check_for_urls: "example.com\nexample.net\nexample.org"
  library: core
  interval: 86400
  useragent: 'Drupal (+https://drupal.org/)'
error:
  action_status_code_301: 0
  action_status_code_404: 0
  ignore_response_codes: '200\r\n206\r\n302\r\n304\r\n401\r\n403'
  impersonate_account: admin
logging:
  level: 7
