id: as_ai_request_form
title: 'Request AgriStability and AgriInvest forms in Excel (AgriStability)'
description: 'Request AgriStability and AgriInvest Forms in Excel&nbsp;(AgriStability)'
category: 'Services Request Form'
elements: |-
  descriptionoffeedbackform:
    '#type': processed_text
    '#text': |
      To receive the AgriStability and AgriInvest forms package in Excel, please complete the following online request form:
    '#format': full_html
  mandatory:
    '#type': processed_text
    '#text': |
      <style type="text/css">p {
        font-size: 16px !important ;
        }
      </style>
      <p class="text-danger">* denotes mandatory field.</p>
    '#format': full_html
  requestor_name_required_:
    '#type': textfield
    '#title': 'Requestor name'
    '#required': true
    '#required_error': 'This field is required.'
  email_address_required_:
    '#type': email
    '#title': 'Email address'
    '#required': true
    '#required_error': 'This field is required.'
  phone_number_1613_666_6666_:
    '#type': tel
    '#title': 'Phone number (+1613 666 6666)'
    '#telephone_validation_format': '0'
  language_of_preference:
    '#type': select
    '#title': 'Language of preference'
    '#options':
      English: English
      French: French
    '#empty_option': English
    '#empty_value': English
  select_your_province_and_then_select_the_forms_package_s_you_wou:
    '#type': checkboxes
    '#title': 'Select your province, and then select the forms package(s) you would like to receive.'
    '#options':
      'For producers in British Columbia, Manitoba, New Brunswick, Nova Scotia, Newfoundland and Labrador or the Yukon': 'For producers in British Columbia, Manitoba, New Brunswick, Nova Scotia, Newfoundland and Labrador or the Yukon'
      'For producers in Alberta, Ontario, Prince Edward Island and Saskatchewan': 'For producers in Alberta, Ontario, Prince Edward Island and Saskatchewan'
    '#required': true
    '#required_error': 'This field is required.'
  for_producers_in_british_columbia_manitoba_new_brunswick_nova_sc:
    '#type': checkboxes
    '#title': 'For producers in British Columbia, Manitoba, New Brunswick, Nova Scotia, Newfoundland and Labrador or the Yukon:'
    '#options':
      '2021 AgriStability and AgriInvest T1273 Forms Package for Individuals.': '2021 AgriStability and AgriInvest T1273 forms package for individuals.'
      '2021 AgriStability and AgriInvest Forms for Corporations, Co-operatives and Special Individuals.': '2021 AgriStability and AgriInvest forms for corporations, co-operatives and special individuals.'
      '2022 AgriStability and AgriInvest Forms for Corporations, Co-operatives and Special Individuals.*': '2022 AgriStability and AgriInvest forms for corporations, co-operatives and special individuals. (2022 forms are available for AgriStability and AgriInvest participants with a non-calendar year end.)'
    '#required_error': 'This field is required.'
    '#states':
      visible-slide:
        ':input[name="select_your_province_and_then_select_the_forms_package_s_you_wou[For producers in British Columbia, Manitoba, New Brunswick, Nova Scotia, Newfoundland and Labrador or the Yukon]"]':
          checked: true
      required:
        ':input[name="select_your_province_and_then_select_the_forms_package_s_you_wou[For producers in British Columbia, Manitoba, New Brunswick, Nova Scotia, Newfoundland and Labrador or the Yukon]"]':
          checked: true
    '#options__properties': ''
  for_producers_in_alberta_ontario_prince_edward_island_and_saskat:
    '#type': checkboxes
    '#title': 'For producers in Alberta, Ontario, Prince Edward Island and Saskatchewan:'
    '#options':
      '2021 AgriStability and AgriInvest T1163 Forms Package for Individuals.': '2021 AgriStability and AgriInvest T1163 forms package for individuals.'
    '#required_error': 'This field is required.'
    '#states':
      visible-slide:
        ':input[name="select_your_province_and_then_select_the_forms_package_s_you_wou[For producers in Alberta, Ontario, Prince Edward Island and Saskatchewan]"]':
          checked: true
      required:
        ':input[name="select_your_province_and_then_select_the_forms_package_s_you_wou[For producers in Alberta, Ontario, Prince Edward Island and Saskatchewan]"]':
          checked: true
    '#options__properties': ''
