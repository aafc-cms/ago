filebrowser:
  folder_path_encoded: ''
  rights:
    explore_subdirs: 1
    download_archive: 1
    create_folders: 1
    download_manager: public
    force_download: 1
    forbidden_files: "descript.ion\r\nfile.bbs\r\n*.git\r\n*.svn"
    whitelist: ''
  uploads:
    enabled: 1
    allow_overwrite: 1
    accepted: 'txt doc docx pdf csv'
  presentation:
    default_view: list-view
    encoding: UTF-8
    hide_extension: 0
    visible_columns:
      icon: icon
      created: created
      size: size
      mimetype: mimetype
      description: description
      name: name
    default_sort: name
    default_sort_order: asc
  adhocsetting:
    externalhost: 'https://agriculture.canada.ca'
