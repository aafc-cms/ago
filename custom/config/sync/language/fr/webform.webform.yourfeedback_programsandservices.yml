elements: "descriptionoffeedbackform:\n  '#text': \"<style>\\n  p {\\n    font-size: 20px;\\n  }\\n</style>\\n <p>Nous accordons une grande importance à vos suggestions et à vos idées. Envoyez-nous vos commentaires pour nous aider à améliorer la conception et la prestation de nos programmes et de nos services. Nous vous sommes reconnaissants de prendre le temps de nous faire part de vos idées et de vos suggestions.</p>\\n <section>\\n <details class=\\\"mrgn-bttm-md open\\\">\\n <summary><h2 class=\\\"h5\\\">Avis de confidentialité</h2></summary>\\n  <p>Les renseignements figurant sur ce formulaire, y compris votre adresse de courriel, sont recueillis conformément à la <a href=\\\"http://laws-lois.justice.gc.ca/fra/lois/F-11/index.html\\\">Loi sur la gestion des finances publiques</a>. Vos renseignements personnels resteront confidentiels et seront utilisés uniquement par les personnes qui doivent fournir des renseignements additionnels demandés par vous. Ces renseignements nous aident à améliorer nos programmes et services et seront utilisés de façon anonyme dans des rapports aux fins de l''amélioration de la prestation de services. Bien que la participation soit volontaire, nous vous encourageons à participer. Vos commentaires nous aideront à déterminer vos défis, vos exigences et vos besoins de façon à mieux appuyer les activités d’AAC. Nous prenons très au sérieux notre responsabilité de protéger vos renseignements personnels conformément à la <a href=\\\"http://lois-laws.justice.gc.ca/fra/lois/P-21/index.html\\\">Loi sur la protection des renseignements personnels</a>; par conséquent, nous vous demandons de ne pas inclure de renseignements personnels de nature délicate (comme votre numéro d''assurance sociale, votre état de santé ou des détails sur votre situation financière) dans votre message. La collecte, l''utilisation et la divulgation de renseignements personnels par AAC sont administrées conformément à la Loi sur la protection des renseignements personnels du gouvernement fédéral et décrites plus en détail dans le <a href=\\\"https://www.canada.ca/fr/secretariat-conseil-tresor/services/acces-information-protection-reseignements-personnels/acces-information/renseignements-programmes-fonds-renseignements/fichiers-renseignements-personnels-ordinaires.html#pou914\\\">fichier des communications publiques POU 914</a>. Toute personne a le droit d’avoir accès aux renseignements qui la concernent et de demander la correction de renseignements personnels qui sont erronés. Pour toute question concernant la protection de vos renseignements personnels, veuillez communiquer avec le Bureau de l''accès à l’information et de la protection des renseignements personnels d''AAC par courriel à <a href=\\\"mailto:aafc.atip-aiprp.aac@canada.ca\\\"><span class=\\\"nowrap\\\">aafc.atip-aiprp.aac@canada.ca</span></a>.</p>\\n </details>\\n </section>\\n \\n\"\ndenotesmandatoryfield:\n  '#text': \"<style type=\\\"text/css\\\">p {\\n  font-size: 16px !important ;\\n  }\\n</style>\\n<p class=\\\"text-danger\\\">* indique un champ obligatoire\\n</p>\\n\"\nprogramorservice:\n  '#title': 'Programme ou service'\n  '#required_error': ' indique un champ obligatoire.'\nemailaddress:\n  '#title': 'Adresse électronique (votrenom@domaine.com)'\nfullname:\n  '#title': 'Nom complet'\ncityortown:\n  '#title': Ville/Village\nprovinceorterritory:\n  '#title': Province/Territoire\ncountry:\n  '#title': Pays\nyourmessage:\n  '#title': 'Votre message'\n"
title: 'Commentaires sur les programmes et les services'
