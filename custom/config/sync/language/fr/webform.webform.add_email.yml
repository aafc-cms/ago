elements: |
  markup:
    '#markup': "<header class=\"panel-heading\">\r\n<h3 class=\"panel-title\">Prêteurs&nbsp;: Abonnez-vous aux alertes</h3>\r\n</header>\r\n\r\n<div class=\"panel-body\">\r\n<p>Abonnez-vous afin de recevoir des rappels par courriel lorsqu’un changement est apporté à l’une des lignes directrices relatives aux prêteurs du Programme de la LCPA ou aux bulletins, procédures, spécifications ou publications.</p>\r\n\r\n<details><summary>\r\n<h4>Énoncé de confidentialité</h4>\r\n</summary>\r\n\r\n<p>Les renseignements personnels recueillis par ce formulaire d’abonnement le sont en vertu de la <a href=\"https://laws-lois.justice.gc.ca/fra/lois/f-2.7/index.html\"> <cite>Loi canadienne sur les prêts agricoles</cite> </a> afin d’envoyer aux prêteurs participants&nbsp;:</p>\r\n\r\n<ul>\r\n\t<li>des courriels d’information sur le programme;</li>\r\n\t<li>des avis sur les séances de formation à venir;</li>\r\n\t<li>des enquêtes d’évaluation du programme.</li>\r\n</ul>\r\n\r\n<p>Les détails de la collecte, de l’utilisation, de la divulgation et de la conservation des renseignements personnels sont décrits dans le Fichier de renseignements personnels : <cite>Loi canadienne sur les prêts agricoles</cite> (AAC PPU 165).</p>\r\n\r\n<p>Les établissements financiers et les prêteurs qui choisissent de ne pas fournir les renseignements demandés ne seront pas ajoutés à la liste d’abonnement du programme et ne recevront pas de correspondance électronique d’AAC et ne seront pas invités à participer à des séances de formation ou à des enquêtes d’évaluation du programme.</p>\r\n\r\n<p>Les renseignements personnels seront traités conformément à la <cite>Loi sur la protection des renseignements personnels</cite>. Les personnes ont le droit à la protection et à la correction de leurs renseignements personnels, ainsi qu’à l’accès à ces derniers. Pour les renseignements personnels sous le contrôle d’AAC, ces droits peuvent être exercés en communiquant avec le directeur de l’accès à l’information et de la protection des renseignements personnels d’AAC à <a href=\"mailto:aafc.atip-aiprp.aac@agr.gc.ca\">aafc.atip-aiprp.aac@agr.gc.ca</a>. Les personnes ont également le droit de déposer une plainte auprès du Commissariat à la protection de la vie privée du Canada concernant la façon dont AAC traite leurs renseignements personnels.</p>\r\n</details>\r\n\r\n<p class=\"mrgn-tp-lg\">Veuillez inscrire votre adresse de courriel dans la case ci-après et cliquer sur le bouton S'abonner.</p>\r\n</div>"
  email_address:
    '#required_error': 'Veuillez fournir une adresse e-mail valide.'
    '#pattern_error': 'Veuillez fournir une adresse e-mail valide.'
  actions:
    '#submit__label': "S'abonner"
settings:
  confirmation_title: Succès
  confirmation_message: '<p>Votre adresse e-mail a été soumise.</p>'
handlers:
  email:
    settings:
      subject: 'La liste de diffusion pour les prêteurs du Programme de la Loi canadienne sur les prêts agricoles'
      body: "<p><span lang=\"FR-CA\" style=\"font-size:11.0pt\"><span style=\"font-family:&quot;Aptos&quot;,sans-serif\">Envoyé le</span></span> [current-date:long]</p>\r\n\r\n<p><span lang=\"FR-CA\" style=\"font-size:11.0pt\"><span style=\"font-family:&quot;Aptos&quot;,sans-serif\">Envoyé par&nbsp;</span></span>:&nbsp;[webform_submission:values:email_address]</p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Aptos,sans-serif\"></span></span><span style=\"font-size:12pt\"><span style=\"line-height:115%\"><span style=\"font-family:Aptos,sans-serif\"></span></span></span></p>\r\n\r\n<p style=\"margin-bottom:11px\"><span style=\"font-size:12pt\"><span style=\"line-height:115%\"><span style=\"font-family:Aptos,sans-serif\">L'adresse courriel ci-dessus a été ajoutée à la liste de diffusion pour les prêteurs du <a href=\"https://can01.safelinks.protection.outlook.com/?url=https%3A%2F%2Fagriculture.canada.ca%2Ffr%2Fprogrammes%2Floi-canadienne-prets-agricoles%2Fnous-joindre&amp;data=05%7C02%7CDeepani.Waidyaratne%40AGR.GC.CA%7C1a3957e037cc4eef43a208dd0b2d89ef%7C9da98bb118574cc387519a49e35d24cd%7C0%7C0%7C638679012404219820%7CUnknown%7CTWFpbGZsb3d8eyJFbXB0eU1hcGkiOnRydWUsIlYiOiIwLjAuMDAwMCIsIlAiOiJXaW4zMiIsIkFOIjoiTWFpbCIsIldUIjoyfQ%3D%3D%7C0%7C%7C%7C&amp;sdata=Z5%2F1quUm8nXgKfnFf9jeZpWovcCenWzp1F6dHY8uvak%3D&amp;reserved=0\" style=\"color:#467886; text-decoration:underline\" target=\"_blank\" title=\"https://agriculture.canada.ca/fr/programmes/loi-canadienne-prets-agricoles/nous-joindre\">Programme de la Loi canadienne sur les prêts agricoles</a>.&nbsp;</span></span></span></p>\r\n\r\n<p style=\"margin-bottom:11px\"><span style=\"font-size:12pt\"><span style=\"line-height:115%\"><span style=\"font-family:Aptos,sans-serif\">&nbsp;Si vous n'avez pas fait cette demande ou si vous souhaitez vous désabonner, veuillez envoyer un courriel à <a href=\"mailto:aafc.CALA-LCPA.aac@agr.gc.ca\" style=\"color:#467886; text-decoration:underline\" target=\"_blank\" title=\"mailto:aafc.cala-lcpa.aac@agr.gc.ca\">aafc.CALA-LCPA.aac@agr.gc.ca</a> ou appelez-nous sans frais au 1-866-367-8506.</span></span></span></p>\r\n\r\n<p><span style=\"font-size:12pt\"><span style=\"line-height:115%\"><span style=\"font-family:Aptos,sans-serif\"></span></span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Aptos,sans-serif\"></span></span></p>"
