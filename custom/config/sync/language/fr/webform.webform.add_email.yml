elements: |
  markup:
    '#markup': '<header class="panel-heading"><h3 class="panel-title">Abonnez-vous aux alertes</h3></header><div class="panel-body"><p>Abonnez-vous en tant que prêteur ou producteur.</p><p><strong>Prêteurs</strong><br>Abonnez-vous afin de recevoir des rappels et des avis par courriel lorsqu’un changement est apporté aux lignes directrices, aux procédures, aux spécifications, aux publications ou aux bulletins relatifs aux prêteurs du Programme de la LCPA, ainsi que des renseignements sur d’autres programmes et initiatives connexes d’AAC.</p><p><strong>Producteurs</strong>&nbsp;<br>Abonnez-vous afin de recevoir des courriels d’information sur le programme, ainsi que des renseignements sur d’autres programmes et initiatives connexes d’AAC.</p><details><summary><h4>Énoncé de confidentialité</h4></summary><p>Les renseignements personnels recueillis par ce formulaire d’abonnement le sont en vertu de la&nbsp;<cite><a href="https://laws-lois.justice.gc.ca/fra/lois/f-2.7/index.html">Loi canadienne sur les prêts agricoles</a></cite><a href="https://laws-lois.justice.gc.ca/fra/lois/f-2.7/index.html">&nbsp;</a>afin d’envoyer aux prêteurs&nbsp;et aux producteurs participants&nbsp;:</p><ul><li>des courriels d’information sur le programme;</li><li>des avis sur les séances de formation à venir;</li><li>des enquêtes d’évaluation du programme;</li><li>de l’information sur des programmes connexes d’AAC.</li></ul><p>Les détails de la collecte, de l’utilisation, de la divulgation et de la conservation des renseignements personnels sont décrits dans le Fichier de renseignements personnels :&nbsp;<cite>Loi canadienne sur les prêts agricoles</cite>&nbsp;(AAC PPU 165).</p><p>Les établissements financiers, les prêteurs et les producteurs qui choisissent de ne pas fournir les renseignements demandés ne seront pas ajoutés à la liste d’abonnement du programme et ne recevront pas de correspondance électronique d’AAC et ne seront pas invités à participer à des séances de formation ou à des enquêtes d’évaluation du programme.</p><p>Les renseignements personnels seront traités conformément à la&nbsp;<cite>Loi sur la protection des renseignements personnels</cite>. Les personnes ont le droit à la protection et à la correction de leurs renseignements personnels, ainsi qu’à l’accès à ces derniers. Pour les renseignements personnels sous le contrôle d’AAC, ces droits peuvent être exercés en communiquant avec le directeur de l’accès à l’information et de la protection des renseignements personnels d’AAC à <a href="mailto:aafc.atip-aiprp.aac@agr.gc.ca">aafc.atip-aiprp.aac@agr.gc.ca</a>. Les personnes ont également le droit de déposer une plainte auprès du Commissariat à la protection de la vie privée du Canada concernant la façon dont AAC traite leurs renseignements personnels.</p></details><p class="mrgn-tp-lg">Veuillez inscrire votre adresse de courriel dans la case ci-après, choisissez « Prêteur » ou « Producteur » et cliquer sur le bouton S''abonner.</p></div>'
  producer_lender:
    '#options':
      Lender: Prêteur
      Producer: Producteur
  email_address:
    '#required_error': 'Veuillez fournir une adresse e-mail valide.'
