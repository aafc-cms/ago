elements: |
  markup:
    '#markup': "<header class=\"panel-heading\">\r\n<h3 class=\"panel-title\">Abonnez-vous aux alertes</h3>\r\n</header>\r\n\r\n<div class=\"panel-body\">\r\n<p>Abonnez-vous pour recevoir des rappels et des notifications par courriel lorsqu'il y a de nouvelles informations sur le Programme d'emploi et de compétences des jeunes</p>\r\n\r\n<details><summary>\r\n<h4>Énoncé de confidentialité</h4>\r\n</summary>\r\n\r\n<p>Les renseignements personnels recueillis sur ce formulaire sont recueillis en vertu de l’article 4 de la<cite>&nbsp;Loi sur l’Agriculture et l’Agroalimentaire</cite> afin d’envoyer des avis par courriel aux abonnés, notamment des avis de mise à jour du programme et des rappels de dates importantes.</p>\r\n\r\n<p>Les détails de la collecte, de l’utilisation, de la divulgation et de la conservation des renseignements personnels sont décrits dans la banque de renseignements personnels : « Programme Objectif carrière » (numéro AAFC PPU 300).</p>\r\n\r\n<p>Les personnes ou les organisations refusant de fournir une adresse électronique ne seront pas ajoutées à la liste d’abonnement du programme et ne recevront pas de notifications par courriel du Programme d’emploi et de compétences des jeunes (PECJ). Un tel refus n’aura aucune incidence sur la relation de la personne ou de l’organisation avec Agriculture et Agroalimentaire Canada. Les personnes ou les organisations peuvent choisir de s’abonner ou de se désabonner à tout moment.</p>\r\n\r\n<p>Les renseignements personnels seront traités conformément à la <cite>Loi sur la protection des renseignements personnels</cite>. Conformément à cette loi, les personnes ont le droit à la protection et à la correction de leurs renseignements personnels, ainsi qu’à l’accès à ces derniers. Pour les renseignements personnels qui relèvent d’AAC, ces droits peuvent être exercés en communiquant avec le coordonnateur de l’accès à l’information et de la protection des renseignements personnels d’AAC à <a href=\"mailto:aafc.atip-aiprp.aac@agr.gc.ca\">aafc.atip-aiprp.aac@agr.gc.ca</a>. Les personnes ont également le droit de déposer une plainte auprès du Commissariat à la protection de la vie privée du Canada concernant le traitement de leurs renseignements personnels par AAC.</p>\r\n</details>\r\n\r\n<p class=\"mrgn-tp-lg\">Veuillez inscrire votre adresse de courriel dans la case ci-après et cliquer sur le bouton S'abonner.</p>\r\n</div>"
  email_address:
    '#title': 'Adresse email'
    '#required_error': 'Veuillez fournir une adresse e-mail valide.'
    '#pattern_error': 'Veuillez fournir une adresse e-mail valide.'
  actions:
    '#submit__label': "S'abonner"
settings:
  confirmation_message: '<p>Votre adresse e-mail a été soumise.</p>'
handlers:
  email:
    settings:
      body: "<p>Envoyé le [current-date:long]</p>\r\n\r\n<p>Envoyé par&nbsp;:&nbsp;[webform_submission:values:email_address]</p>\r\n\r\n<p>L'adresse courriel ci-dessus a été ajoutée à la liste de diffusion pour les prêteurs du <span style=\"font-size:12.0pt\"><span style=\"font-family:&quot;Aptos&quot;,sans-serif\"><a href=\"https://can01.safelinks.protection.outlook.com/?url=https%3A%2F%2Fagriculture.canada.ca%2Ffr%2Fprogrammes%2Femploi-competences-jeunes&amp;data=05%7C02%7Caafc.cmswebapps-sgcappsweb.aac%40agr.gc.ca%7C36785b4323f5492c03df08dd373bb484%7C9da98bb118574cc387519a49e35d24cd%7C0%7C0%7C638727451736925555%7CUnknown%7CTWFpbGZsb3d8eyJFbXB0eU1hcGkiOnRydWUsIlYiOiIwLjAuMDAwMCIsIlAiOiJXaW4zMiIsIkFOIjoiTWFpbCIsIldUIjoyfQ%3D%3D%7C0%7C%7C%7C&amp;sdata=jLryB7rkghLVxCMJpWghO2XkTLap%2Fs94am5HV67ExIE%3D&amp;reserved=0\" style=\"color:#0563c1; text-decoration:underline\" target=\"_blank\" title=\"https://agriculture.canada.ca/fr/programmes/loi-canadienne-prets-agricoles/nous-joindre\">Programme d'emploi et de compétences des jeunes</a></span></span><span lang=\"FR-CA\" style=\"font-size:12.0pt\"><span style=\"font-family:&quot;Aptos&quot;,sans-serif\">.</span></span></p>\r\n\r\n<p>&nbsp;Si vous n'avez pas fait cette demande ou si vous souhaitez vous désabonner, veuillez envoyer un courriel à<span lang=\"FR-CA\" style=\"font-size:12.0pt\"><span style=\"font-family:&quot;Aptos&quot;,sans-serif\">&nbsp;</span></span><span style=\"font-size:12.0pt\"><span style=\"font-family:&quot;Aptos&quot;,sans-serif\"><a href=\"mailto:aafc.yesp-pecj.aac@agr.gc.ca\" style=\"color:#0563c1; text-decoration:underline\" target=\"_blank\" title=\"mailto:aafc.cala-lcpa.aac@agr.gc.ca\">aafc.yesp-pecj.aac@agr.gc.ca</a></span></span> ou appelez-nous sans frais au 1-866-452-5558.</p>"
      subject: "La liste de diffusion pour le Programme d'emploi et de compétences des jeunes"
