elements: |
  descriptionoffeedbackform:
    '#text': "<p>Faites-nous parvenir vos questions ou commentaires à l'aide de ce formulaire.</p>\r\n\r\n<section>\r\n<details class=\"mrgn-bttm-md open\"><summary>\r\n<h2 class=\"h5\">Avis de confidentialité</h2>\r\n</summary>\r\n\r\n<p>Les renseignements demandés dans le présent formulaire seront utilisés pour répondre à votre demande de renseignements et sont recueillis conformément à la <a href=\"http://laws-lois.justice.gc.ca/fra/lois/A-9/index.html\">Loi sur le ministère de l'Agriculture et de l'Agroalimentaire</a>. Les renseignements personnels seront protégés conformément à la <a href=\"http://laws-lois.justice.gc.ca/fra/lois/p-21/index.html\">Loi sur la protection des renseignements personnels</a> et décrits dans le Fichier de renseignements personnels <a href=\"https://www.canada.ca/fr/secretariat-conseil-tresor/services/acces-information-protection-reseignements-personnels/acces-information/renseignements-programmes-fonds-renseignements/fichiers-renseignements-personnels-ordinaires.html#pou914\">AAC POU 914 (Communications publiques)</a>. Toute personne a le droit d'accéder aux renseignements personnels que détient Agriculture et Agroalimentaire Canada à son sujet et de demander la correction d'erreurs en communiquant avec notre coordonnateur de l'accès à l'information et de la protection des renseignements personnels à <a href=\"mailto:aafc.atip-aiprp.aac@canada.ca\">aafc.atip-aiprp.aac@canada.ca</a>.</p>\r\n</details>\r\n</section>\r\n"
  denotesmandatoryfield:
    '#text': "<p class=\"text-danger\">* indique un champ obligatoire</p>\r\n"
