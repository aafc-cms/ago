settings:
  confirmation_message: "<h1>Votre r&eacute;troaction a &eacute;t&eacute; soumise</h1>\r\n\r\n<p>Nous vous remercions pour votre r&eacute;troaction. Si vous avez fourni une adresse de courriel, vous recevrez une r&eacute;ponse dans les cinq jours ouvrables. Sinon, vous ne recevrez pas de r&eacute;ponse.</p>\r\n\r\n<p>D&eacute;couvrez comment AAC utilise les r&eacute;troactions sur l&rsquo;accessibilit&eacute; en consultant la description de notre processus.</p>\r\n\r\n<p><a href=\"/fr/node/3061\">Processus de r&eacute;troaction sur l&rsquo;accessibilit&eacute;</a></p>"
