  confirmation_message: "<h3>Merci de votre aide!</h3>\r\n\r\n<p>Vous ne recevrez pas de réponse. Pour toute question,&nbsp;<a href=\"https://www.canada.ca/fr/contact/index.html\">contactez-nous</a>.</p>\r\n"
