id: add_email
title: 'Add email'
description: ''
categories: {  }
elements: |-
  container:
    '#type': container
    '#attributes':
      class:
        - panel
        - panel-default
    markup:
      '#type': webform_markup
      '#markup': |-
        <header class="panel-heading">
        <h3 class="panel-title">Sign up for alerts</h3>
        </header>

        <div class="panel-body">
        <p>Subscribe as a lender or a producer.</p>

        <p><strong>Lenders</strong><br />
        Subscribe to receive email reminders and notifications when there are changes to any of the CALA Program lender guidelines, bulletins, procedures, specifications, or publications&nbsp;and to receive information about other related AAFC programs and initiatives.</p>

        <p><strong>Producers</strong><br />
        Subscribe to receive informational emails about the program and information about other related AAFC programs and initiatives.</p>

        <details><summary>
        <h4>Privacy notice statement</h4>
        </summary>

        <p>The personal information collected on this subscription form is collected under the authority of the <a href="https://laws-lois.justice.gc.ca/eng/acts/f-2.7/index.html"> <cite>Canadian Agricultural Loans Act</cite> </a> for the purposes of sending participating lenders and producers:</p>

        <ul>
        	<li>Informational emails about the program</li>
        	<li>Notice of upcoming training sessions</li>
        	<li>Program evaluation surveys</li>
        	<li>Information about related AAFC programs</li>
        </ul>

        <p>Details of the collection, use, disclosure, and retention of personal information are described in Personal Information Bank: <cite>Canadian Agricultural Loans Act</cite> (AAFC PPU 165). Financial facilities, lenders and producers choosing not to provide the information requested will not to be added to the program’s subscription list and will not receive electronic correspondences from AAFC or be asked to participate in training sessions or program evaluation surveys.</p>

        <p>Personal information will be handled in accordance with the <cite>Privacy Act</cite>. Individuals have the right to the protection and correction of, and access to, their personal information. For personal information under the control of AAFC, these rights may be exercised by contacting the AAFC Access to Information and Privacy Director at <a href="mailto:aafc.atip-aiprp.aac@agr.gc.ca">aafc.atip-aiprp.aac@agr.gc.ca</a>. Individuals also have the right to file a complaint with the Office of the Privacy Commissioner of Canada concerning AAFC’s handling of their personal information.</p>
        </details>

        <p class="mrgn-tp-lg">Please enter your email address in the box below, choose "Lender" or "Producer," then click the Subscribe button.</p>
        </div>
    producer_lender:
      '#type': radios
      '#title': Producer/Lender
      '#title_display': none
      '#options':
        Lender: Lender
        Producer: Producer
      '#wrapper_attributes':
        style: 'margin-left: 16px; margin-top: -30px'
    email_address:
      '#type': email
      '#title': 'Email Address'
      '#required_error': 'Please provide valid email address.'
      '#unique': true
      '#unique_entity': true
      '#unique_user': true
      '#unique_error': 'The email address you submitted is already subscribed. If you have any questions, please contact the program.'
      '#pattern': '^[^\s@]+@[^\s@]+$'
      '#pattern_error': 'Please provide valid email address.'
      '#states':
        required:
          ':input[name="email_address"]':
            empty: true
      '#attributes':
        style: 'margin-left: 16px'
      '#label_attributes':
        style: 'margin-left: 16px; margin-top: 0px'
    actions:
      '#type': webform_actions
      '#title': 'Submit button(s)'
      '#attributes':
        style: 'margin-left: 16px'
      '#submit__label': Subscribe
