name: 'AAFC Theme'
description: 'WxT sub-theme(s) support leveraging WxT Bootstrap.'
type: theme
core_version_requirement: ^9 || ^10
package: 'WxT'
base theme: wxt_bootstrap

regions:
  branding: 'Branding'
  breadcrumb: 'Breadcrumbs'
  language_toggle: 'Language Toggle'
  banner: 'Banner'
  search: 'Search'
  navigation: 'Navigation'
  navigation_collapsible: 'Navigation (Collapsible)'
  header: 'Header'
  highlighted_not_front: 'Highlighted Not Front'
  highlighted_front_only: 'Highlighted Front only'
  highlighted: 'Highlighted'
  help: 'Help'
  content: 'Content'
  content_footer: 'Content Footer'
  sidebar_first: 'Sidebar First'
  sidebar_second: 'Sidebar Second'
  footer: 'Footer'
  page_top: 'Page top'
  page_bottom: 'Page bottom'

libraries:
  - 'aafctheme/global-styling'

#libraries:
#  - 'aafctheme/framework'

libraries-extend:
  bootstrap/framework:
    - 'aafctheme/drupal.aafctheme'

entity_print:
  node:
    # Adds the all-nodes library to all node PDF’s.
    all: 'aafctheme/print-styling'
  view:
    # Adds the all-nodes library to all node PDF’s.
    all: 'aafctheme/print-styling'
