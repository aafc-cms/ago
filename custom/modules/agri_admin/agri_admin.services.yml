services:
  path_processor.agri_admin:
    class: Drupal\agri_admin\PathProcessor\PathProcessorAgriAdmin
    tags:
      - { name: path_processor_inbound, priority: 1000 }
      - { name: path_processor_outbound, priority: 1000 }

  agri_admin.entity_print_filename_generator:
    class: Drupal\agri_admin\Service\DecoratedFilenameGenerator
    decorates: entity_print.filename_generator
    arguments: ['@agri_admin.entity_print_filename_generator.inner', '@transliteration', '@event_dispatcher']

  agri_admin.entity_print_filename_generator.inner:
    alias: entity_print.filename_generator
