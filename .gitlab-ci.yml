stages:
  - test
  - d8x

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml
  - template: Security/Dependency-Scanning.gitlab-ci.yml
  - template: Security/Container-Scanning.gitlab-ci.yml
  
trigger_build:
  stage: d8x
  script:
    - "curl -X POST -F token=$D8X_TRIGGER_TOKEN -F ref=master -F variables[SOURCE_COMMIT_MSG]=\"$CI_COMMIT_MESSAGE\" -F variables[SOURCE_URL]=\"$CI_PROJECT_URL\" -F variables[SOURCE_SHORT_SHA]=$CI_COMMIT_SHORT_SHA -F variables[SOURCE_SHA]=$CI_COMMIT_SHA https://gitlab.com/api/v4/projects/22824509/trigger/pipeline"